name: Deploy

# Builds the prerendered site and publishes it to Cloudflare Pages.
#
# The build asks the GitHub API for the app's latest release
# (scripts/fetch-release.mjs), so the version number and download links are
# always current. Three triggers keep them that way:
# - a push to main (site changes),
# - repository_dispatch "sayso-release", sent by the app's release workflow
#   right after a release is published,
# - a daily run, as a fallback when the dispatch isn't configured.
#
# Secrets: CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID. Variable (optional): SITE_URL for a custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sayso-release]
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=sayso --branch=main --commit-dirty=true
